services:
  postgres:
    image: postgres:16-alpine
    container_name: bcnrockers-postgres
    environment:
      - POSTGRES_USER=bcnrockers
      - POSTGRES_PASSWORD=bcnrockers_password
      - POSTGRES_DB=bcnrockers_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bcnrockers -d bcnrockers_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bcnrockers-backend
    ports:
      - "8002:8002"
    environment:
      - DATABASE_URL=postgresql://bcnrockers:bcnrockers_password@postgres:5432/bcnrockers_db
      # ⚠️  Cambia SECRET_KEY por un valor seguro antes de usar en producción
      - SECRET_KEY=${SECRET_KEY:-tu-clave-super-segura-cambiar-en-produccion}
      - DEBUG=${DEBUG:-False}
      # Orígenes CORS extra (separados por coma). Déjalo vacío en local.
      # Ejemplo: CORS_ORIGINS=https://tu-app.vercel.app
      - CORS_ORIGINS=${CORS_ORIGINS:-}
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8002 --reload
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8002/')\""]
      interval: 30s
      timeout: 10s
      retries: 3
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: bcnrockers-frontend
    ports:
      - "3000:3000"
    environment:
      # En local apunta al backend en Docker; en producción usa la URL de Render
      - VITE_API_URL=${VITE_API_URL:-http://localhost:8002}
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev -- --host 0.0.0.0
    depends_on:
      - backend

volumes:
  postgres_data:
