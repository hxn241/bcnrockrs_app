services:
  postgres:
    image: postgres:16-alpine
    container_name: bcnrockers-postgres
    environment:
      - POSTGRES_USER=bcnrockers
      - POSTGRES_PASSWORD=bcnrockers_password
      - POSTGRES_DB=bcnrockers_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bcnrockers -d bcnrockers_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bcnrockers-backend
    ports:
      - "8002:8002"
    environment:
      - POSTGRES_URL=postgresql://bcnrockers:bcnrockers_password@postgres:5432/bcnrockers_db
      # ⚠️  Cambia SECRET_KEY por un valor seguro antes de usar en producción
      - SECRET_KEY=${SECRET_KEY:-tu-clave-super-segura-cambiar-en-produccion}
      - DEBUG=${DEBUG:-False}
      # Orígenes CORS extra (separados por coma). Déjalo vacío en local.
      # Ejemplo: CORS_ORIGINS=https://tu-app.vercel.app
      - CORS_ORIGINS=${CORS_ORIGINS:-}
      # Valhalla para /maps/route-guidance (vacío = solo OSRM). Con perfil valhalla: http://valhalla:8002
      - VALHALLA_BASE_URL=${VALHALLA_BASE_URL:-}
      - VALHALLA_COSTING=${VALHALLA_COSTING:-motorcycle}
      - VALHALLA_GUIDANCE_LANGUAGE=${VALHALLA_GUIDANCE_LANGUAGE:-es-ES}
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8002 --reload
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8002/')\""]
      interval: 30s
      timeout: 10s
      retries: 3
    depends_on:
      postgres:
        condition: service_healthy

  # Valhalla (opcional): docker compose --profile valhalla up
  # Docs: docs/VALHALLA.md — Define VALHALLA_BASE_URL=http://valhalla:8002 en .env raíz
  valhalla:
    profiles:
      - valhalla
    image: ghcr.io/nilsnolde/docker-valhalla/valhalla:latest
    container_name: kurvemaster-valhalla
    ports:
      - "8003:8002"
    volumes:
      - ./docker/valhalla/custom_files:/custom_files
    environment:
      # Extracto pequeño para primera prueba; cambia por cataluna/spain en docker-compose o docs/VALHALLA.md
      - tile_urls=https://download.geofabrik.de/europe/andorra-latest.osm.pbf
      - use_tiles_ignore_pbf=False
      - server_threads=2

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: bcnrockers-frontend
    ports:
      - "3000:3000"
    environment:
      # En local apunta al backend en Docker; en producción usa la URL de Render
      - VITE_API_URL=${VITE_API_URL:-http://localhost:8002}
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev -- --host 0.0.0.0
    depends_on:
      - backend

volumes:
  postgres_data:
